<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        header h1 { font-size: 2em; margin-bottom: 10px; }
        nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
        nav button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            font-size: 0.95em;
        }
        nav button:hover { background: rgba(255,255,255,0.4); }
        section { padding: 30px; }
        .hidden { display: none !important; }
        
        /* Quiz Cards */
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .quiz-card {
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .quiz-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-color: #667eea;
        }
        .quiz-card h3 { color: #667eea; margin-bottom: 10px; }
        .quiz-card p { color: #666; margin: 5px 0; font-size: 0.95em; }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-top: 10px;
        }
        .status.published { background: #48bb78; color: white; }
        .status.draft { background: #ed8936; color: white; }
        
        /* Forms */
        .form-panel {
            background: #f7fafc;
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .form-panel input,
        .form-panel textarea,
        .form-panel select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
        }
        .form-panel textarea { min-height: 80px; resize: vertical; }
        .form-panel button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
            margin-right: 8px;
        }
        
        /* Problem Items */
        .problem-item {
            background: #f7fafc;
            padding: 15px;
            border-radius: 10px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .problem-item .info { flex: 1; min-width: 200px; }
        .problem-item button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #f56565;
            color: white;
        }
        
        /* Quiz Play */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        .problem-display {
            text-align: center;
            padding: 30px;
            background: #f7fafc;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .problem-display img {
            max-width: 100%;
            max-height: 350px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .problem-display .question {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 15px;
        }
        .answer-input {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }
        .answer-input input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
        }
        .answer-input button {
            padding: 14px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
        }
        .feedback {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1em;
        }
        .feedback.correct { background: #c6f6d5; color: #22543d; }
        .feedback.wrong { background: #fed7d7; color: #742a2a; }
        
        /* Results */
        .result-box {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin: 20px 0;
        }
        .result-box h2 { font-size: 3em; margin-bottom: 15px; }
        .result-box .stats { font-size: 1.4em; }
        
        /* Comments */
        .comments-section { margin-top: 30px; }
        .comments-section h3 { margin-bottom: 15px; color: #667eea; }
        .comment-list { max-height: 250px; overflow-y: auto; }
        .comment-item {
            background: #f7fafc;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
        }
        .comment-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .comment-form input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }
        .comment-form button {
            padding: 10px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        .btn-success { background: #48bb78; color: white; }
        .btn-danger { background: #f56565; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Quiz App</h1>
            <nav>
                <button onclick="showView('user-quizzes')">📚 Play Quizzes</button>
                <button onclick="showView('admin-panel')">⚙️ Admin Panel</button>
            </nav>
        </header>

        <!-- USER: Quiz List -->
        <section id="user-quizzes">
            <h2>Available Quizzes</h2>
            <div id="user-quiz-grid" class="quiz-grid"></div>
        </section>

        <!-- USER: Quiz Intro -->
        <section id="quiz-intro" class="hidden">
            <button class="btn btn-secondary" onclick="showView('user-quizzes')">← Back</button>
            <div id="intro-content" class="form-panel" style="margin-top: 20px;"></div>
            <button class="btn btn-primary" onclick="startQuiz()" style="width: 100%; margin-top: 20px; padding: 18px; font-size: 1.2em;">Start Quiz</button>
        </section>

        <!-- USER: Play Quiz -->
        <section id="quiz-play" class="hidden">
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
            <div id="problem-display" class="problem-display"></div>
            <div class="answer-input">
                <input type="text" id="answer-input" placeholder="Type your answer..." autocomplete="off">
                <button onclick="submitAnswer()">Submit</button>
            </div>
            <div id="feedback" class="feedback hidden"></div>
        </section>

        <!-- USER: Results -->
        <section id="quiz-result" class="hidden">
            <div id="result-content" class="result-box"></div>
            <div class="comments-section">
                <h3>💬 Comments</h3>
                <div id="comment-list" class="comment-list"></div>
                <div class="comment-form">
                    <input type="text" id="comment-input" placeholder="Add a comment...">
                    <button onclick="addComment()">Post</button>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="showView('user-quizzes')" style="width: 100%; margin-top: 20px; padding: 15px;">Back to Quizzes</button>
        </section>

        <!-- ADMIN: Quiz List -->
        <section id="admin-panel" class="hidden">
            <h2>Manage Quizzes</h2>
            <button class="btn btn-primary" onclick="showCreateQuizForm()">+ Create New Quiz</button>
            <div id="admin-quiz-grid" class="quiz-grid"></div>
            
            <div id="create-quiz-form" class="form-panel hidden" style="margin-top: 20px;">
                <h3>Create Quiz</h3>
                <input type="text" id="quiz-title" placeholder="Quiz Title">
                <textarea id="quiz-description" placeholder="Description"></textarea>
                <select id="quiz-type">
                    <option value="image">Image Quiz</option>
                    <option value="text">Text Quiz</option>
                    <option value="mixed">Mixed</option>
                </select>
                <button class="btn btn-primary" onclick="createQuiz()">Create</button>
                <button class="btn btn-secondary" onclick="hideCreateQuizForm()">Cancel</button>
            </div>
        </section>

        <!-- ADMIN: Quiz Detail -->
        <section id="admin-quiz-detail" class="hidden">
            <button class="btn btn-secondary" onclick="showView('admin-panel')">← Back</button>
            <div id="quiz-detail-content" class="form-panel" style="margin-top: 20px;"></div>
            <h3 style="margin-top: 25px;">Problems</h3>
            <button class="btn btn-primary" onclick="showAddProblemForm()">+ Add Problem</button>
            <div id="problem-list"></div>
            
            <div id="add-problem-form" class="form-panel hidden" style="margin-top: 20px;">
                <h4>Add Problem</h4>
                <input type="text" id="problem-question" placeholder="Question">
                <input type="text" id="problem-answer" placeholder="Answer (comma-separated for multiple)">
                <input type="text" id="problem-image" placeholder="Image URL (optional)">
                <button class="btn btn-primary" onclick="addProblem()">Add</button>
                <button class="btn btn-secondary" onclick="hideAddProblemForm()">Cancel</button>
            </div>
        </section>
    </div>

    <script>
        // ============ DATA STORE (localStorage) ============
        const DB = {
            getQuizzes() {
                return JSON.parse(localStorage.getItem('quizzes') || '[]');
            },
            saveQuizzes(quizzes) {
                localStorage.setItem('quizzes', JSON.stringify(quizzes));
            },
            getComments(quizId) {
                return JSON.parse(localStorage.getItem(`comments_${quizId}`) || '[]');
            },
            saveComments(quizId, comments) {
                localStorage.setItem(`comments_${quizId}`, JSON.stringify(comments));
            },
            getAttempts(quizId) {
                return JSON.parse(localStorage.getItem(`attempts_${quizId}`) || '[]');
            },
            saveAttempt(quizId, attempt) {
                const attempts = this.getAttempts(quizId);
                attempts.push(attempt);
                localStorage.setItem(`attempts_${quizId}`, JSON.stringify(attempts));
            }
        };

        // ============ NAVIGATION ============
        function showView(viewId) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            
            if (viewId === 'user-quizzes') loadUserQuizzes();
            if (viewId === 'admin-panel') loadAdminQuizzes();
        }

        // ============ USER FUNCTIONS ============
        let currentQuiz = null;
        let problems = [];
        let currentProblemIndex = 0;
        let score = 0;
        let userAnswers = {};

        function loadUserQuizzes() {
            const quizzes = DB.getQuizzes().filter(q => q.published);
            const grid = document.getElementById('user-quiz-grid');
            grid.innerHTML = '';
            
            if (quizzes.length === 0) {
                grid.innerHTML = '<p style="color: #666; padding: 20px;">No quizzes available yet.</p>';
                return;
            }
            
            quizzes.forEach(quiz => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.innerHTML = `
                    <h3>${quiz.title}</h3>
                    <p>${quiz.description}</p>
                    <p>Type: ${quiz.type}</p>
                    <p>Problems: ${quiz.problems ? quiz.problems.length : 0}</p>
                `;
                card.onclick = () => showQuizIntro(quiz);
                grid.appendChild(card);
            });
        }

        function showQuizIntro(quiz) {
            currentQuiz = quiz;
            document.getElementById('intro-content').innerHTML = `
                <h2>${quiz.title}</h2>
                <p>${quiz.description}</p>
                <p>Type: ${quiz.type}</p>
                <p>Total Problems: ${quiz.problems ? quiz.problems.length : 0}</p>
            `;
            showView('quiz-intro');
        }

        function startQuiz() {
            problems = currentQuiz.problems || [];
            if (problems.length === 0) {
                alert('No problems in this quiz!');
                return;
            }
            currentProblemIndex = 0;
            score = 0;
            userAnswers = {};
            showView('quiz-play');
            showProblem();
        }

        function showProblem() {
            const problem = problems[currentProblemIndex];
            const display = document.getElementById('problem-display');
            const progress = document.getElementById('progress');
            
            progress.style.width = `${((currentProblemIndex + 1) / problems.length) * 100}%`;
            
            let mediaHtml = '';
            if (problem.image) {
                mediaHtml = `<img src="${problem.image}" alt="Question image">`;
            }
            
            display.innerHTML = `
                <div class="question">Problem ${currentProblemIndex + 1} / ${problems.length}</div>
                <p style="font-size: 1.2em; margin: 15px 0;">${problem.question}</p>
                ${mediaHtml}
            `;
            
            document.getElementById('answer-input').value = '';
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('answer-input').focus();
        }

        function submitAnswer() {
            const answer = document.getElementById('answer-input').value.trim().toLowerCase();
            if (!answer) {
                alert('Please enter an answer!');
                return;
            }
            
            const problem = problems[currentProblemIndex];
            const correctAnswers = problem.answer.split(',').map(a => a.trim().toLowerCase());
            const isCorrect = correctAnswers.includes(answer);
            
            userAnswers[problem.id] = answer;
            
            const feedback = document.getElementById('feedback');
            feedback.classList.remove('hidden');
            
            if (isCorrect) {
                score++;
                feedback.textContent = '✅ Correct!';
                feedback.className = 'feedback correct';
            } else {
                feedback.textContent = `❌ Wrong! Answer: ${problem.answer}`;
                feedback.className = 'feedback wrong';
            }
            
            setTimeout(() => {
                currentProblemIndex++;
                if (currentProblemIndex < problems.length) {
                    showProblem();
                } else {
                    showResult();
                }
            }, 1500);
        }

        function showResult() {
            const percentage = Math.round((score / problems.length) * 100);
            
            // Save attempt
            DB.saveAttempt(currentQuiz.id, {
                score: score,
                total: problems.length,
                percentage: percentage,
                date: new Date().toISOString()
            });
            
            // Calculate percentile
            const attempts = DB.getAttempts(currentQuiz.id);
            const betterCount = attempts.filter(a => a.percentage > percentage).length;
            const percentile = Math.round(100 - (betterCount / attempts.length * 100)) || 100;
            
            document.getElementById('result-content').innerHTML = `
                <h2>${percentage}%</h2>
                <div class="stats">
                    <p>Score: ${score} / ${problems.length}</p>
                    <p>Top ${percentile}%!</p>
                </div>
            `;
            
            // Load comments
            loadComments();
            showView('quiz-result');
        }

        function loadComments() {
            const comments = DB.getComments(currentQuiz.id);
            const list = document.getElementById('comment-list');
            list.innerHTML = '';
            
            comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.textContent = c.text;
                list.appendChild(item);
            });
        }

        function addComment() {
            const text = document.getElementById('comment-input').value.trim();
            if (!text) return;
            
            const comments = DB.getComments(currentQuiz.id);
            comments.push({ text, date: new Date().toISOString() });
            DB.saveComments(currentQuiz.id, comments);
            
            document.getElementById('comment-input').value = '';
            loadComments();
        }

        // ============ ADMIN FUNCTIONS ============
        function loadAdminQuizzes() {
            const quizzes = DB.getQuizzes();
            const grid = document.getElementById('admin-quiz-grid');
            grid.innerHTML = '';
            
            if (quizzes.length === 0) {
                grid.innerHTML = '<p style="color: #666; padding: 20px;">No quizzes yet. Create one!</p>';
                return;
            }
            
            quizzes.forEach(quiz => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.innerHTML = `
                    <h3>${quiz.title}</h3>
                    <p>${quiz.description}</p>
                    <p>Problems: ${quiz.problems ? quiz.problems.length : 0}</p>
                    <span class="status ${quiz.published ? 'published' : 'draft'}">
                        ${quiz.published ? 'Published' : 'Draft'}
                    </span>
                `;
                card.onclick = () => showQuizDetail(quiz);
                grid.appendChild(card);
            });
        }

        function showCreateQuizForm() {
            document.getElementById('create-quiz-form').classList.remove('hidden');
        }

        function hideCreateQuizForm() {
            document.getElementById('create-quiz-form').classList.add('hidden');
            document.getElementById('quiz-title').value = '';
            document.getElementById('quiz-description').value = '';
        }

        function createQuiz() {
            const title = document.getElementById('quiz-title').value.trim();
            const description = document.getElementById('quiz-description').value.trim();
            const type = document.getElementById('quiz-type').value;
            
            if (!title) {
                alert('Please enter a title!');
                return;
            }
            
            const quizzes = DB.getQuizzes();
            const newQuiz = {
                id: Date.now(),
                title,
                description,
                type,
                published: false,
                problems: [],
                createdAt: new Date().toISOString()
            };
            
            quizzes.push(newQuiz);
            DB.saveQuizzes(quizzes);
            
            hideCreateQuizForm();
            loadAdminQuizzes();
        }

        function showQuizDetail(quiz) {
            currentQuiz = quiz;
            document.getElementById('quiz-detail-content').innerHTML = `
                <h2>${quiz.title}</h2>
                <p>${quiz.description}</p>
                <p>Type: ${quiz.type}</p>
                <p>Status: ${quiz.published ? 'Published' : 'Draft'}</p>
                <button class="btn ${quiz.published ? 'btn-danger' : 'btn-success'}" 
                        onclick="togglePublish()" style="margin-top: 10px;">
                    ${quiz.published ? 'Unpublish' : 'Publish'}
                </button>
                <button class="btn btn-danger" onclick="deleteQuiz()" style="margin-top: 10px; margin-left: 10px;">Delete Quiz</button>
            `;
            loadProblems();
            showView('admin-quiz-detail');
        }

        function togglePublish() {
            const quizzes = DB.getQuizzes();
            const quiz = quizzes.find(q => q.id === currentQuiz.id);
            if (quiz) {
                quiz.published = !quiz.published;
                DB.saveQuizzes(quizzes);
                showQuizDetail(quiz);
            }
        }

        function deleteQuiz() {
            if (!confirm('Delete this quiz?')) return;
            const quizzes = DB.getQuizzes().filter(q => q.id !== currentQuiz.id);
            DB.saveQuizzes(quizzes);
            showView('admin-panel');
        }

        function showAddProblemForm() {
            document.getElementById('add-problem-form').classList.remove('hidden');
        }

        function hideAddProblemForm() {
            document.getElementById('add-problem-form').classList.add('hidden');
            document.getElementById('problem-question').value = '';
            document.getElementById('problem-answer').value = '';
            document.getElementById('problem-image').value = '';
        }

        function addProblem() {
            const question = document.getElementById('problem-question').value.trim();
            const answer = document.getElementById('problem-answer').value.trim();
            const image = document.getElementById('problem-image').value.trim();
            
            if (!question || !answer) {
                alert('Question and answer are required!');
                return;
            }
            
            const quizzes = DB.getQuizzes();
            const quiz = quizzes.find(q => q.id === currentQuiz.id);
            if (quiz) {
                if (!quiz.problems) quiz.problems = [];
                quiz.problems.push({
                    id: Date.now(),
                    question,
                    answer,
                    image: image || null
                });
                DB.saveQuizzes(quizzes);
                hideAddProblemForm();
                loadProblems();
            }
        }

        function loadProblems() {
            const list = document.getElementById('problem-list');
            list.innerHTML = '';
            
            const problems = currentQuiz.problems || [];
            if (problems.length === 0) {
                list.innerHTML = '<p style="color: #666; padding: 15px;">No problems yet.</p>';
                return;
            }
            
            problems.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'problem-item';
                item.innerHTML = `
                    <div class="info">
                        <strong>#${index + 1}</strong> ${p.question}
                        <br><small>Answer: ${p.answer}</small>
                        ${p.image ? `<br><small>Image: ${p.image}</small>` : ''}
                    </div>
                    <button onclick="deleteProblem(${p.id})">Delete</button>
                `;
                list.appendChild(item);
            });
        }

        function deleteProblem(problemId) {
            if (!confirm('Delete this problem?')) return;
            
            const quizzes = DB.getQuizzes();
            const quiz = quizzes.find(q => q.id === currentQuiz.id);
            if (quiz && quiz.problems) {
                quiz.problems = quiz.problems.filter(p => p.id !== problemId);
                DB.saveQuizzes(quizzes);
                loadProblems();
            }
        }

        // Enter key support
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('answer-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitAnswer();
            });
            document.getElementById('comment-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addComment();
            });
        });

        // Start
        showView('user-quizzes');
    </script>
</body>
</html>
